vosk:
  # Default: expect the model under the project folder (works well for demo setups)
  model_path: models/vosk-model-small-en-us-0.15

piper:
  # Optional. If not set, TTS will fall back to a basic system voice.
  model_path: null

audio:
  # CAPTURE (ReSpeaker)
  input_device: "plughw:CARD=Headset,DEV=0" # "plughw:CARD=ArrayUAC10,DEV=0"
  input_rate: 16000
  input_channels: 1

  # PLAYBACK (USB Audio)
  output_device: "plughw:CARD=Headset,DEV=0" # "plughw:CARD=Audio,DEV=0"
  record_seconds: 3

wakeword:
  model_path: null
  threshold: 0.4                 # openWakeWord score za aktivaciju
  frame_ms: 80                   # dužina frejma za wakeword (80ms je default)
  min_activation_frames: 3       # koliko uzastopnih frejmova iznad thresholda
  min_rms: 1000
vad:
  aggressiveness: 2              # 0–3 (3 = najagresivniji)
  silence_ms: 800                # koliko tišine zaredom znači “kraj rečenice”
  max_record_ms: 8000            # hard limit za dužinu snimanja jedne rečenice

stt:
  mode: auto            # free | command | auto
  grammar:
    - "status"
    - "system status"
    - "time"
    - "date"
    - "what time is it"
    - "what's the time"
    - "list memory"
    - "clear memory"
    - "what is my name"
    - "my name is"
    - "go to sleep"
    - "sleep"
    - "wake up"
    - "wake"
    - "volume"
    - "volume up"
    - "volume down"
    - "mute"
    - "unmute"
    - "stop"

  aliases:
    "what time is it": "time"
    "what's the time": "time"
    "system status": "status"
    "wake": "wake up"
    "sleep": "go to sleep"

conversation:
  # After wake, Joe stays in conversation mode for ~2-5 minutes
  active_listen_min_s: 120
  active_listen_max_s: 300
  wake_phrase: "Hey Joe"
  wake_ack: "Hi."

personality:
  # 0-3 each, deterministic
  warmth: 2
  humor: 1
  directness: 2

llm:
  # Lightweight fallback used only when no local skill matches (and in conversation mode)
  # Default assumes a local OpenAI-compatible endpoint (e.g., Ollama's /v1)
  enabled: false
  base_url: "http://localhost:11434/v1"
  api_key: null
  model: "llama3"
  timeout_s: 20

camera:
  enabled: true
  device: "/dev/video0"
  backend: "v4l2"
